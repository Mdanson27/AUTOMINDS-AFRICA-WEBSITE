name: Deploy AutoMinds Africa Website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare production artifact
        run: |
          rm -rf build
          mkdir -p build/.well-known
          cp -a index.html systems.html projects.html team.html contact.html build/
          cp -a v2.css v3.css v4.css mobile-v5.css mobile-v6.css project-previews.css build/
          cp -a site.js contact-compose.js build/
          cp -a autominds-africa-logo.png airplane-take-off-svgrepo-com.png "AMF-NFC LANDSCAPE (1).mp4" build/
          cp -a .well-known/security.txt build/.well-known/security.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "build"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
